name: Release

# Build the macOS app and publish a GitHub Release when a v* tag is pushed.
# The release notes are the version's entry in CHANGELOG.md; see "Releasing"
# in docs/development.md.
#   git tag -a v0.3.0 -m "AgentMux v0.3.0" && git push origin v0.3.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Full three-component version: swift.org publishes 6.4 as swift-6.4.0-RELEASE
  # (6.1-6.3 used the two-component form). This also names the installed
  # toolchain dir, which must match scripts/env.sh.
  SWIFT_VERSION: "6.4.0"

jobs:
  release:
    runs-on: macos-15 # Apple Silicon; its macOS 15 SDK matches local builds (macos-14's older SDK breaks a dependency under Swift 6 concurrency)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the previous release

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Before the long build: the bundle's default version and CHANGELOG.md
      # must already be at this version.
      - name: Check version and changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          grep -qF "AGENTMUX_VERSION:-$VERSION}" scripts/bundle-app.sh \
            || { echo "::error::scripts/bundle-app.sh does not default to $VERSION"; exit 1; }
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          grep -q '[^[:space:]]' RELEASE_NOTES.md \
            || { echo "::error::CHANGELOG.md has no entry for $VERSION"; exit 1; }
          PREVIOUS=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS" "$GITHUB_REF_NAME" >> RELEASE_NOTES.md
          fi

      - name: Install Swift ${{ env.SWIFT_VERSION }} toolchain
        run: |
          set -eux
          PKG="swift-${SWIFT_VERSION}-RELEASE-osx.pkg"
          URL="https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/${PKG}"
          curl -fL "$URL" -o "$RUNNER_TEMP/$PKG"
          sudo installer -pkg "$RUNNER_TEMP/$PKG" -target /
          echo "AGENTMUX_TOOLCHAIN=/Library/Developer/Toolchains/swift-${SWIFT_VERSION}-RELEASE.xctoolchain" >> "$GITHUB_ENV"

      - name: Build and bundle the app
        env:
          AGENTMUX_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/bundle-app.sh release

      - name: Package
        run: |
          set -eux
          ZIP="AgentMux-${{ steps.version.outputs.version }}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent build/AgentMux.app "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.ZIP }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
