name: Release

# Build the macOS app and publish a GitHub Release when a v* tag is pushed.
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Full three-component version: swift.org publishes 6.4 as swift-6.4.0-RELEASE
  # (6.1-6.3 used the two-component form). This also names the installed
  # toolchain dir, which must match scripts/env.sh.
  SWIFT_VERSION: "6.4.0"

jobs:
  release:
    runs-on: macos-15 # Apple Silicon; its macOS 15 SDK matches local builds (macos-14's older SDK breaks a dependency under Swift 6 concurrency)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the changelog

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Swift ${{ env.SWIFT_VERSION }} toolchain
        run: |
          set -eux
          PKG="swift-${SWIFT_VERSION}-RELEASE-osx.pkg"
          URL="https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/${PKG}"
          curl -fL "$URL" -o "$RUNNER_TEMP/$PKG"
          sudo installer -pkg "$RUNNER_TEMP/$PKG" -target /
          echo "AGENTMUX_TOOLCHAIN=/Library/Developer/Toolchains/swift-${SWIFT_VERSION}-RELEASE.xctoolchain" >> "$GITHUB_ENV"

      - name: Build and bundle the app
        env:
          AGENTMUX_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/bundle-app.sh release

      - name: Package
        run: |
          set -eux
          ZIP="AgentMux-${{ steps.version.outputs.version }}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent build/AgentMux.app "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.ZIP }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
