# git-cliff configuration — https://git-cliff.org
# Generates CHANGELOG.md and release notes from Conventional Commits.

[changelog]
header = """
# Changelog

All notable changes to AgentMux are documented here.
This project follows [Conventional Commits](https://www.conventionalcommits.org).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^style", group = "<!-- 5 -->Styling" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^ci", group = "<!-- 7 -->CI/CD" },
  { message = "^build", group = "<!-- 7 -->CI/CD" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 8 -->Miscellaneous" },
  { body = ".*security", group = "<!-- 9 -->Security" },
]
